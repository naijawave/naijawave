<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" role="img" aria-label="Naija Wave mark">
  <defs>
    <linearGradient id="nwb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="nwv" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <radialGradient id="nwg" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFEDBE"/>
      <stop offset="1" stop-color="#E8B94A"/>
    </radialGradient>
  </defs>
  <!-- Bold rounded N -->
  <path d="M12 50 V15 a6 6 0 0 1 12 0 V37 L40 13 a6 6 0 0 1 9.4 7.4 V48"
        fill="none" stroke="url(#nwb)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right stroke dissolving into three rising wave bars -->
  <rect x="42" y="34" width="7" height="16" rx="3.5" fill="url(#nwv)" opacity="0.95"/>
  <rect x="52" y="24" width="7" height="26" rx="3.5" fill="url(#nwv)" opacity="0.8"/>
  <rect x="62" y="14" width="7" height="36" rx="3.5" fill="url(#nwv)" opacity="0.65"/>
  <!-- Gold dot at the crest -->
  <circle cx="65.5" cy="7.5" r="4.6" fill="url(#nwg)"/>
</svg>
