<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naija Wave">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="description" content="Naija Wave — Ride your wave. Nigeria's own social platform. Connect, share, chat, call, and follow the Naija Pulse.">
<meta name="keywords" content="Naija Wave, Nigerian social media, Naija Pulse, Afrobeats, Nigeria, social platform">
<meta property="og:title" content="Naija Wave — Ride your wave">
<meta property="og:description" content="Nigeria's own social platform. Connect, share, chat, call, and follow the Naija Pulse.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://naijawave.onrender.com/">
<meta name="twitter:card" content="summary_large_image">
<title>Naija Wave — Ride your wave</title>
<link rel="icon" type="image/svg+xml" href="img/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="/socket.io/socket.io.js" defer></script>
</head>
<body>
<div id="app">
  <!-- Top app bar (mobile) -->
  <header id="appbar" class="appbar hidden">
    <button id="menuBtn" class="iconbtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="#/home" class="brand" aria-label="Naija Wave home">
      <img src="img/logo.svg" alt="Naija Wave" class="brand-logo">
    </a>
    <div class="appbar-actions">
      <a href="#/notifications" class="iconbtn bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="bellDot" class="dot hidden"></span>
      </a>
      <a href="#/profile/me" id="appbarAvatar" class="avatarlink" aria-label="Your profile">
        <img id="appbarAvatarImg" class="avatar xs" src="" alt="">
      </a>
    </div>
  </header>

  <!-- Desktop sidebar -->
  <aside id="sidebar" class="sidebar hidden" aria-label="Primary">
    <a href="#/home" class="brand"><img src="img/logo.svg" alt="Naija Wave" class="brand-logo"></a>
    <nav id="sideNav" class="sidenav"></nav>
    <div class="side-foot">
      <button id="sideWaveBtn" class="btn primary block">+ New wave</button>
      <div id="sideMe" class="sideme"></div>
    </div>
  </aside>

  <!-- Main view -->
  <main id="view" class="view" tabindex="-1"></main>

  <!-- Right rail (desktop) -->
  <aside id="rail" class="rail hidden" aria-label="Discover">
    <div class="rail-inner">
      <div class="rail-card" id="railTrends"></div>
      <div class="rail-card" id="railSuggest"></div>
    </div>
  </aside>

  <!-- Bottom tab bar (mobile) -->
  <nav id="tabbar" class="tabbar hidden" aria-label="Tabs"></nav>
</div>

<!-- Slide-in drawer -->
<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Menu">
  <div class="drawer-head">
    <img src="img/mark.svg" alt="" class="mark-sm">
    <div class="drawer-id">
      <div id="drawerName" class="drawer-name"></div>
      <div id="drawerUser" class="drawer-user"></div>
    </div>
  </div>
  <nav id="drawerNav" class="drawernav"></nav>
  <div class="drawer-foot">
    <button id="drawerLogout" class="btn ghost block">Log out</button>
  </div>
</aside>

<!-- Overlays, modals, sheets -->
<div id="overlayRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>
<div id="offlineBar" class="offline hidden" role="status">You're offline — messages will send when you reconnect.</div>

<noscript><div class="noscript">Naija Wave needs JavaScript to run.</div></noscript>
<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
