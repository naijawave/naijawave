# Render Blueprint — one-click deploy of Naija Wave (API + frontend + realtime).
# In Render: New > Blueprint > connect your repo. Then set the env vars below.
#
# DATABASE: Postgres via Supabase (free tier). The app uses pg when DATABASE_URL
# is set. Data survives redeploys — the old SQLite wipe-on-deploy problem is gone.
# Create a free project at supabase.com → Project Settings → Database → copy the
# connection string (URI) → paste it as DATABASE_URL in the Render dashboard.
# (Do NOT commit the real connection string to the repo.)
services:
  - type: web
    name: naijawave
    runtime: node
    plan: free
    buildCommand: npm ci && node scripts/smoke-pg.js
    startCommand: node src/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SETUP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # TURN relay — private Metered account (naijawave.metered.live).
      # Replaces the public OpenRelay demo, which did not work on the user's
      # network. Free trial 500 MB + $30 credit. If these credentials ever
      # leak/rotate, update them here (or move them to the Render dashboard
      # Environment page and remove them from this file).
      - key: STUN_URL
        value: stun:stun.relay.metered.ca:80
      - key: TURN_URL
        value: "turn:global.relay.metered.ca:80,turn:global.relay.metered.ca:80?transport=tcp,turn:global.relay.metered.ca:443,turns:global.relay.metered.ca:443?transport=tcp"
      - key: TURN_USER
        value: "4397a942ff25720be005110e"
      - key: TURN_PASS
        value: "UG62a/Axj01BIqan"
