# Render Blueprint — one-click deploy of Naija Wave (API + frontend + realtime).
# In Render: New > Blueprint > connect your repo. Then set the env vars below.
#
# DATABASE: Postgres via Supabase (free tier). The app uses pg when DATABASE_URL
# is set. Data survives redeploys — the old SQLite wipe-on-deploy problem is gone.
# Create a free project at supabase.com → Project Settings → Database → copy the
# connection string (URI) → paste it as DATABASE_URL in the Render dashboard.
# (Do NOT commit the real connection string to the repo.)
services:
  - type: web
    name: naijawave
    runtime: node
    plan: free
    buildCommand: npm ci && node scripts/smoke-pg.js
    startCommand: node src/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SETUP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # TURN relay (free public OpenRelay demo server) — lets calls connect
      # when the two phones can't reach each other directly (strict NAT /
      # Wi-Fi isolation). No signup. Later, swap for a private free Metered
      # account (50 GB/mo) by changing these three values.
      - key: TURN_URL
        value: turn:openrelay.metered.ca:80,turn:openrelay.metered.ca:443,turns:openrelay.metered.ca:443
      - key: TURN_USER
        value: openrelayproject
      - key: TURN_PASS
        value: openrelayproject
