# Render Blueprint — one-click deploy of Naija Wave (API + frontend + realtime).
# In Render: New > Blueprint > connect your repo. Then set the env vars below.
#
# NOTE (free plan):
# - Uses Render's native Node runtime (no Docker): simpler + faster builds.
# - PORT is injected by Render automatically — do NOT set it here.
# - No persistent disk on the free plan: the database and uploads live on the
#   instance filesystem. They survive sleep/restarts, but reset on redeploy.
#   Add a disk (Starter plan) or move to Postgres before real users arrive.
services:
  - type: web
    name: naijawave
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: OTP_MODE
        value: dev
      - key: DB_PATH
        value: /app/data/naijawave.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: SETUP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
