# Render Blueprint — one-click deploy of Naija Wave (API + frontend + realtime).
# In Render: New > Blueprint > connect your repo. Then set the env vars below.
#
# NOTE (free plan):
# - PORT is injected by Render automatically — do NOT set it here.
# - Persistent disks are not available on the free plan, so the database and
#   uploads live inside the container: they survive sleeps/restarts, but reset
#   on redeploy. Add a disk (or move to Postgres) when you upgrade to Starter.
services:
  - type: web
    name: naijawave
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTP_MODE
        value: dev
      - key: DB_PATH
        value: /app/data/naijawave.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: SETUP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
